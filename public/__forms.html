<!--
  Statisches Formular-Duplikat nur für die Netlify-Formular-Erkennung beim
  Build (SSG). Netlify durchsucht die veröffentlichten HTML-Dateien nach
  <form data-netlify="true">-Elementen; das echte Formular im
  ContactOverlay wird per Vue erst zur Laufzeit gerendert und würde beim
  statischen Scan nicht gefunden. Diese Seite wird nie verlinkt oder
  aufgerufen.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form detection</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organisation" />
      <input type="checkbox" name="concern[]" value="Stage direction" />
      <input type="checkbox" name="concern[]" value="New format / staged concert" />
      <input type="checkbox" name="concern[]" value="Participatory project" />
      <input type="checkbox" name="concern[]" value="Workshop" />
      <input type="checkbox" name="concern[]" value="Press" />
      <input type="checkbox" name="concern[]" value="Other" />
      <input type="text" name="period" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
